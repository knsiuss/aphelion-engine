[package]
name = "aphelion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aphelion_cli"
path = "src/lib.rs"

[[bin]]
name = "aphelion"
path = "src/main.rs"

[dependencies]
aphelion-core = { path = "../../core" }
aphelion-telemetry = { path = "../../telemetry" }
bytes = "1"
flate2 = "1.0"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "signal", "time", "sync"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[[test]]
name = "e2e_proxy"
path = "../../../tests/e2e_proxy.rs"

[[test]]
name = "v3_gateway"
path = "../../../tests/v3_gateway.rs"

[[test]]
name = "observability_v31"
path = "../../../tests/observability_v31.rs"

[[test]]
name = "ui_and_router_v32"
path = "../../../tests/ui_and_router_v32.rs"

[[test]]
name = "claude_code_compat"
path = "../../../tests/claude_code_compat.rs"

[[test]]
name = "claude_code_cache_v34"
path = "../../../tests/claude_code_cache_v34.rs"

[[test]]
name = "smart_routing_v35"
path = "../../../tests/smart_routing_v35.rs"

[[test]]
name = "rtk_and_combo_v36"
path = "../../../tests/rtk_and_combo_v36.rs"

[[test]]
name = "audit_remediation_v33"
path = "../../../tests/audit_remediation_v33.rs"
