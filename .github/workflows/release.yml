name: Aphelion CI & Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy strict gate
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests & SSE chaos fuzzer
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build release CLI & run Node.js package verification
        run: |
          cargo build --release -p aphelion-cli
          node packages/cli-npm/test.mjs
          node packages/middleware-js/test.mjs

  build-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aphelion-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: aphelion-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: aphelion-linux-x64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aphelion-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p aphelion-cli
      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/aphelion${EXT}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish (GitHub Release binaries published)."
            exit 0
          fi
          mkdir -p packages/cli-npm/bin/native
          cp dist/* packages/cli-npm/bin/native/
          npm publish --access public ./packages/cli-npm
          npm publish --access public ./packages/middleware-js
